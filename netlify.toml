[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects from old Wix paths so existing links/search ranking resolve to new IA.
# Each [[redirects]] block defines one 301 redirect.

[[redirects]]
  from = "/anxiety-counselling-in-hemet-ca"
  to = "/services/anxiety/hemet"
  status = 301

[[redirects]]
  from = "/depression-counselling-in-riverside-ca"
  to = "/services/depression/riverside"
  status = 301

[[redirects]]
  from = "/depression-counselling-in-murrieta-ca"
  to = "/services/depression/murrieta"
  status = 301

[[redirects]]
  from = "/depression-counselling-in-hemet-ca"
  to = "/services/depression/hemet"
  status = 301

[[redirects]]
  from = "/relationship-issues-counselling-in-riverside-ca"
  to = "/services/relationship/riverside"
  status = 301

[[redirects]]
  from = "/relationship-issues-counselling-in-murrieta-ca"
  to = "/services/relationship/murrieta"
  status = 301

[[redirects]]
  from = "/relationship-issues-counselling-in-hemet-ca"
  to = "/services/relationship/hemet"
  status = 301

[[redirects]]
  from = "/anger-management-counselling-in-riverside-ca"
  to = "/services/anger-management/riverside"
  status = 301

[[redirects]]
  from = "/anger-management-counselling-in-murrieta-ca"
  to = "/services/anger-management/murrieta"
  status = 301

[[redirects]]
  from = "/anger-management-counselling-in-hemet-ca"
  to = "/services/anger-management/hemet"
  status = 301

[[redirects]]
  from = "/eating-disorders-counselling-in-riverside-ca"
  to = "/services/eating-disorders/riverside"
  status = 301

[[redirects]]
  from = "/eating-disorders-counselling-in-murrieta-ca"
  to = "/services/eating-disorders/murrieta"
  status = 301

[[redirects]]
  from = "/eating-disorders-counselling-in-hemet-ca"
  to = "/services/eating-disorders/hemet"
  status = 301

[[redirects]]
  from = "/meet-the-board"
  to = "/about/board"
  status = 301

[[redirects]]
  from = "/event-list"
  to = "/events"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"